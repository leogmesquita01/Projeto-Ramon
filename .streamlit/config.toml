[theme]
# Cor primária de destaque (Verde Lima DevLeads)
primaryColor = "#B8F22D"

# Fundo principal preto profundo (DevLeads)
backgroundColor = "#050505"

# Fundo dos cartões e barra lateral
secondaryBackgroundColor = "#0C0C0C"

# Cor dos textos
textColor = "#EDEDED"

# Fonte padrão
font = "sans serif"

[client]
# Permite exibir mensagens de erro detalhadas em vez de mensagem oculta
showErrorDetails = "full"
toolbarMode = "minimal"
